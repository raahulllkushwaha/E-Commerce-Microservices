server:
  port: 8082

spring:
  application:
    name: product-service

  security:
    user:
      name: user
      password: root

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:ecommerce_product_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true