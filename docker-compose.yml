version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  user-service:
    build: ./UserService
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce_user_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres

  product-service:
    build: ./ProductService
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce_product_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres

  order-service:
    build: ./Order-Service
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce_order_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka

  payment-service:
    build: ./Payment-Service
    ports:
      - "8084:8084"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce_payment_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - kafka

  notification-service:
    build: ./Notification-Service
    ports:
      - "8085:8085"
    depends_on:
      - kafka

  api-gateway:
    build: ./ApiGateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service

volumes:
  pgdata: